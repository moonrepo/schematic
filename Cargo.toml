[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
arrayvec = "0.7.8"
chrono = "0.4.45"
compact_str = "0.10.0"
convert_case = "0.12.0"
darling = "0.24.1"
hashbrown = { version = "0.17.1", default-features = false }
indexmap = "2.14.2"
jiff = { version = "1.0.0", default-features = false }
miette = "7.6.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
regex = "1.13.1"
relative-path = "2.0.2"
ron = "0.12.2"
rpkl = "0.8.0"
rust_decimal = "1.43.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.33"
serde_norway = "0.9.42"
smallvec = "1.16.3"
smol_str = { version = "0.3.0", default-features = false }
starbase_sandbox = "0.12.0"
syn = "3.0.9"
toml = "1.1.8"
tracing = "0.1.44"
ureq = { version = "3.4.2", features = ["rustls", "platform-verifier"] }
url = "2.5.8"
uuid = "1.28.0"
