[package]
name = "schematic_macros"
version = "0.21.3"
edition = "2024"
license = "MIT"
description = "Macros for the schematic crate."
homepage = "https://moonrepo.github.io/schematic"
repository = "https://github.com/moonrepo/schematic"

[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[dependencies]
schematic_core = { version = "0.2.3", path = "../core" }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
schematic = { path = "../schematic", features = [
	"config",
	"env",
	"extends",
	"json",
	"schema",
	"schema_serde",
	"type_arrayvec",
	"type_hashbrown",
	"type_smallvec",
	"validate",
] }
schematic_macros = { path = ".", features = [
	"config",
	"env",
	"extends",
	"schema",
	"validate",
] }
serde = { workspace = true }
serde_json = { workspace = true }

# Types
arrayvec = { workspace = true, features = ["serde"] }
hashbrown = { workspace = true, features = ["default-hasher", "serde"] }
smallvec = { workspace = true, features = ["serde"] }

[features]
default = []
config = ["schematic_core/config"]
env = ["schematic_core/env"]
extends = ["schematic_core/extends"]
schema = ["schematic_core/schema"]
validate = ["schematic_core/validate"]
