[package]
name = "schematic_macros"
version = "0.20.2"
edition = "2024"
license = "MIT"
description = "Macros for the schematic crate."
homepage = "https://moonrepo.github.io/schematic"
repository = "https://github.com/moonrepo/schematic"

[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[dependencies]
schematic_core = { version = "0.1.2", path = "../core" }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
schematic = { path = "../schematic", features = [
	"config",
	"env",
	"extends",
	"json",
	"schema",
	"schema_serde",
	"validate",
] }
schematic_macros = { path = ".", features = [
	"config",
	"env",
	"extends",
	"schema",
	"validate",
] }
serde = { workspace = true }
serde_json = { workspace = true }
starbase_sandbox = { workspace = true }

[features]
default = []
config = ["schematic_core/config"]
env = ["schematic_core/env"]
extends = ["schematic_core/extends"]
schema = ["schematic_core/schema"]
validate = ["schematic_core/validate"]
