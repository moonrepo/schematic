[package]
name = "schematic"
version = "0.20.12"
edition = "2024"
license = "MIT"
description = "A layered serde configuration and schema library."
homepage = "https://moonrepo.github.io/schematic"
repository = "https://github.com/moonrepo/schematic"
readme = "../../README.md"
rust-version = "1.85.0"

[package.metadata.release]
pre-release-replacements = [
	{ file = "../../CHANGELOG.md", search = "Unreleased", replace = "{{version}}" },
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
schematic_macros = { version = "0.20.11", path = "../macros", optional = true }
schematic_types = { version = "0.12.11", path = "../types" }
miette = { workspace = true, optional = true }

# config
garde = { version = "0.23.0", default-features = false, optional = true, features = [
	"regex",
] }
serde = { workspace = true, optional = true }
serde-content = { version = "0.1.2", optional = true }
serde_path_to_error = { version = "0.1.20", optional = true }
starbase_styles = { version = "0.6.10", optional = true }
thiserror = { version = "2.0.21", optional = true }
tracing = { workspace = true, optional = true }

# settings
regex = { workspace = true, optional = true }
semver = { workspace = true, optional = true }

# schema
convert_case = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true, features = ["serde"] }

# json
json-strip-comments = { version = "3.1.2", optional = true }
serde_json = { workspace = true, optional = true, features = [
	"preserve_order",
] }

# json schema
markdown = { version = "1.0.0", optional = true }
schemars = { version = "1.2.3", optional = true, default-features = false }

# pkl
rpkl = { workspace = true, optional = true }

# ron
ron = { workspace = true, optional = true }

# toml
toml = { workspace = true, optional = true }

# yaml
serde_norway = { workspace = true, optional = true }

# url
ureq = { workspace = true, optional = true }

[features]
default = ["config", "env", "extends", "validate"]
config = [
	"dep:convert_case",
	"dep:miette",
	"dep:serde",
	"dep:serde-content",
	"dep:serde_path_to_error",
	"dep:starbase_styles",
	"dep:thiserror",
	"dep:tracing",
	"dep:schematic_macros",
	"schematic_macros/config",
]
schema = [
	"dep:indexmap",
	"dep:miette",
	"dep:schematic_macros",
	"schematic_macros/schema",
]
schema_serde = ["schema", "schematic_types/serde"]

# Features
# These only apply to configs, so they enable them
env = ["config", "schematic_macros/env"]
extends = ["config", "schematic_macros/extends"]
url = ["config", "dep:ureq"]
validate = ["config", "dep:garde", "schematic_macros/validate"]

# Formats
json = [
	"dep:json-strip-comments",
	"dep:serde_json",
	"schematic_types/serde_json",
]
pkl = ["dep:rpkl", "schematic_types/serde_rpkl"]
ron = ["dep:ron", "schematic_types/serde_ron"]
toml = ["dep:toml", "schematic_types/serde_toml"]
yaml = ["dep:serde_norway", "schematic_types/serde_yaml_norway"]

# Renderers
renderer_api_docs = ["schema"]
renderer_json_schema = ["json", "schema", "dep:markdown", "dep:schemars"]
renderer_pkl_schema = ["schema", "dep:convert_case"]
renderer_template = ["schema"]
renderer_typescript = ["schema", "dep:convert_case"]

# Types
type_arrayvec = ["schematic_types/arrayvec"]
type_chrono = ["schematic_types/chrono"]
type_compact_str = ["schematic_types/compact_str"]
type_hashbrown = ["schematic_types/hashbrown"]
type_indexmap = ["schematic_types/indexmap", "dep:indexmap"]
type_jiff = ["schematic_types/jiff"]
type_regex = ["schematic_types/regex", "dep:regex"]
type_relative_path = ["schematic_types/relative_path"]
type_rust_decimal = ["schematic_types/rust_decimal", "garde?/rust_decimal"]
type_semver = ["schematic_types/semver", "dep:semver"]
type_smallvec = ["schematic_types/smallvec"]
type_smol_str = ["schematic_types/smol_str"]
type_url = ["schematic_types/url"]
type_uuid = ["schematic_types/uuid"]

# Validation
validate_email = ["validate", "garde/email"]
validate_url = ["validate", "garde/url"]

[dev-dependencies]
schematic = { path = ".", features = [
	"config",
	"env",
	"extends",
	"json",
	"pkl",
	"renderer_api_docs",
	"renderer_json_schema",
	"renderer_pkl_schema",
	"renderer_template",
	"renderer_typescript",
	"ron",
	"schema",
	"schema_serde",
	"toml",
	"type_arrayvec",
	"type_chrono",
	"type_compact_str",
	"type_hashbrown",
	"type_indexmap",
	"type_jiff",
	"type_regex",
	"type_relative_path",
	"type_rust_decimal",
	"type_semver",
	"type_smallvec",
	"type_smol_str",
	"type_url",
	"type_uuid",
	"url",
	"validate",
	"validate_email",
	"validate_url",
	"yaml",
] }
serial_test = "4.0.1"
# Only to prove loading works from inside an async runtime
tokio = { version = "1.53.2", features = ["macros", "rt"] }
similar = "3.2.0"
starbase_sandbox = { workspace = true }
strip-ansi-escapes = "0.2.1"
derive_more = { version = "2.1.1", features = ["try_into", "as_ref"] }

# Types
arrayvec = { workspace = true, features = ["serde"] }
chrono = { workspace = true, features = ["serde"] }
compact_str = { workspace = true, features = ["serde"] }
hashbrown = { workspace = true, features = ["default-hasher", "serde"] }
indexmap = { workspace = true }
jiff = { workspace = true, features = ["serde", "std"] }
relative-path = { workspace = true, features = ["serde"] }
rust_decimal = { workspace = true }
semver = { workspace = true, features = ["serde"] }
smallvec = { workspace = true, features = ["serde"] }
smol_str = { workspace = true, features = ["serde", "std"] }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["serde"] }
